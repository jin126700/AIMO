[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimo"
version = "1.0.0"
description = "Looped Transformer predictor for internal update flow of original-variant pairs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# Server-only extras. Never required by the CPU test suite.
server = [
    # Qwen3 support needs transformers>=4.51; the local CPU check falls back to Qwen2.
    "transformers>=4.51",
    "accelerate>=0.30",
]

[project.scripts]
aimo = "aimo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
